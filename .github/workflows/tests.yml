# Shared standards: eigger/hass-repo-standards@78d242092eac
name: Tests
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  current:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@v1.1.3
    with:
      domain: icscale
      python-versions: '["3.14"]'
      requirements: requirements_test.txt
      dependency-modes: '["current", "minimum"]'
      minimum-packages: '["blesession"]'
      ha-components: bluetooth bluetooth_adapters recorder
      expected-ha-version: '2026.10.2'
      test-profile: ha
      pytest-args: tests/components/icscale/ -v
  minimum-ha:
    # hacs.json declares homeassistant 2025.2.0; keep this exact-minimum job.
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@v1.1.3
    with:
      domain: icscale
      python-versions: '["3.13"]'
      requirements: requirements_test_min.txt
      ha-components: bluetooth bluetooth_adapters recorder
      expected-ha-version: '2025.2.0'
      test-profile: ha
      pytest-args: tests/components/icscale/ -v
